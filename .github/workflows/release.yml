name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Static musl binary -- works on any x86_64 Linux distro without
      # matching the runner's glibc version.
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package static binary
        run: |
          strip target/x86_64-unknown-linux-musl/release/proton-ntfs-fix
          tar czf proton-ntfs-fix-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release proton-ntfs-fix

      # Dynamically linked (glibc) binary -- used as the basis for the
      # .deb/.rpm packages, matching what those distros expect.
      - name: Build glibc binary
        run: |
          cargo build --release
          strip target/release/proton-ntfs-fix

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build .deb package
        run: cargo deb --no-build --no-strip

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            proton-ntfs-fix-x86_64-linux.tar.gz
            target/debian/*.deb
            target/generate-rpm/*.rpm
