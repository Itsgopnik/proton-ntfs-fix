name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Strip and package
        run: |
          strip target/x86_64-unknown-linux-musl/release/proton-ntfs-fix
          tar czf proton-ntfs-fix-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release proton-ntfs-fix

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: proton-ntfs-fix-x86_64-linux.tar.gz
